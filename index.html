<style>
:root{--d:#0b3d2e;--g:#1b7a4b;--l:#e6f2e8;--gold:#f2b632;--bg:#f3f6f1;--tx:#14261c;--mu:#5d7065}

.hero{position:relative;overflow:hidden;color:#fff;padding:14px 18px 96px;background:linear-gradient(175deg,#06291f 0%,#0b3d2e 35%,#1b7a4b 75%,#3f9a5f)}

.st div{background:var(--bg);border-radius:14px;padding:10px;text-align:center;font-size:.8rem;color:var(--mu)}.st b{display:block;font-size:1.1rem;color:var(--tx)}

.up{color:var(--mu);font-size:.75rem;text-align:center}

#cam video{flex:1;min-height:0;object-fit:cover;width:100%}
.cb{display:flex;justify-content:space-around;align-items:center;padding:18px;background:#000}
.sh{width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:var(--gold);cursor:pointer}
#ov{position:fixed;inset:0;background:#0007;z-index:60;display:none}

label{font-weight:600;font-size:.85rem}input[type=text],input[type=password],select{width:100%;padding:11px;border:1.5px solid #d5e0d5;border-radius:12px;margin:4px 0 12px;font-size:.95rem;font-family:inherit}

.bar{padding-top:4px}.logo{letter-spacing:.2px}

.card{border:1px solid #e4ece3;transition:transform .25s,box-shadow .25s}.card:hover{transform:translateY(-2px);box-shadow:0 12px 32px #0b3d2e22}

.g2{grid-template-columns:repeat(2,1fr)}

function chunks(s){const out=[];(String(s).replace(/\s+/g," ").match(/[^.!?।॥]+[.!?।॥]*/g)||[String(s)]).forEach(x=>{x=x.trim();while(x.length>160){let i=x.lastIndexOf(" ",160);if(i<40)i=160;out.push(x.slice(0,i));x=x.slice(i).trim()}if(x)out.push(x)});return out}
function stopSp(){spTok++;try{speechSynthesis.cancel()}catch(e){}document.querySelectorAll(".sp.on").forEach(b=>b.classList.remove("on"))}
function speak(txt,btn,lg){if(!window.speechSynthesis||!txt)return;lg=lg||S.lang;if(btn&&btn.classList.contains("on")){stopSp();return}stopSp();
 const tok=spTok,q=chunks(txt),lang=VL[lg];if(!vo.length)loadV();
 const v=vo.find(x=>x.lang.replace("_","-").toLowerCase()==lang.toLowerCase())||vo.find(x=>x.lang.toLowerCase().startsWith(lg));
 if(!v&&lg!="en"&&vo.length)toast(T[lg].nov);
 if(btn)btn.classList.add("on");
 const done=()=>{if(tok==spTok)document.querySelectorAll(".sp.on").forEach(b=>b.classList.remove("on"))};
 q.forEach((c,i)=>{const u=new SpeechSynthesisUtterance(c);u.lang=lang;u.rate=+S.rate;if(v)u.voice=v;u.onend=()=>{if(i==q.length-1)done()};u.onerror=e=>{if(e.error!="canceled"&&e.error!="interrupted")done()};speechSynthesis.speak(u)})}

/* ---- scans: only latest in feed, rest in gallery ---- */
let busy=null,gv=null,scans=[];const SAY={},SAYL={};
try{scans=JSON.parse(localStorage.getItem("km2s")||"[]")}catch(e){scans=[]}
const saveScans=()=>{scans=scans.slice(0,24);for(;;){try{localStorage.setItem("km2s",JSON.stringify(scans));return}catch(e){if(scans.length<=1)return;scans.pop()}}};
const norm=d=>{const z=x=>x==null?"":String(x);let st=d.steps;if(!Array.isArray(st))st=z(st).split(/\n|\d\.\s/);return{healthy:d.healthy===true||d.healthy=="true",severity:z(d.severity),problem:z(d.problem),steps:st.map(z).map(x=>x.trim()).filter(Boolean),pesticide:z(d.pesticide),organic:z(d.organic),safety:z(d.safety)}};
function shrink(url,max,q){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(i.width*k));c.height=Math.max(1,Math.round(i.height*k));c.getContext("2d").drawImage(i,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",q))};i.onerror=rej;i.src=url})}
function scanView(r,key){const L=r.demo?S.lang:r.lang,tt=k=>T[L][k],d=r.demo?{healthy:false,severity:"Medium",...T[L].dm}:r.d;
 const c=d.healthy?"#1b7a4b":d.severity=="High"?"#d32f2f":"#f29900",l=d.healthy?tt("good"):d.severity=="High"?tt("bad"):tt("mid");
 const say=[l,d.problem,tt("fix"),...d.steps,tt("pest"),d.pesticide,tt("org"),d.organic,tt("safe"),d.safety,r.demo?tt("demo"):""].filter(Boolean).map(x=>x.replace(/[.।]+\s*$/,"")).join(". ")+".";
 SAY[key]=say;SAYL[key]=L;
 const when=new Date(r.ts).toLocaleString(VL[S.lang],{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
 return card("lf",tt("scanT"),when,esc(d.problem),`<img class="th" src="${r.img}"><span class="pill" style="background:${c}">${l}</span>${r.demo?`<p><small>${tt("demo")}</small></p>`:""}<h4>${tt("fix")}</h4><ol>${d.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol><h4>${tt("pest")}</h4><p>${esc(d.pesticide)}</p><h4>${tt("org")}</h4><p>${esc(d.organic)}</p><h4>${tt("safe")}</h4><p>${esc(d.safety)}</p>`,say).replace(/data-i="\d+"/,`data-k="${key}"`)}
async function analyze(url){busy=url;render();window.scrollTo({top:0,behavior:"smooth"});
 const r={id:Date.now(),ts:Date.now(),demo:!S.gk,lang:S.lang,img:url};
 try{
  if(S.gk){const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),45000);
   try{const tx=await gem([{inline_data:{mime_type:"image/jpeg",data:url.split(",")[1]}},{text:`You are an agriculture expert helping a small farmer in India. Expected crop: ${S.crop}. Look at the photo. Reply ONLY JSON with keys: healthy(boolean), severity("Low"|"Medium"|"High"), problem(short), steps(array of 3 short actions), pesticide(suitable medicine and dose; advise consulting local agri officer), organic(natural option), safety(one line). Write all values in ${FL[S.lang]} using very simple words.`}],true,ctl.signal);
    const m=tx.match(/\{[\s\S]*\}/);r.d=norm(JSON.parse(m?m[0]:tx))}finally{clearTimeout(to)}}
  try{r.img=await shrink(url,720,.7)}catch(e){}
 }catch(e){busy=null;render();push(`<div class="card">${t("err")}<br><small>${esc(e.name=="AbortError"?"Timeout":e.message)}</small></div>`);return}
 busy=null;scans.unshift(r);saveScans();render();window.scrollTo({top:0,behavior:"smooth"});
 if(S.auto)speak(SAY.u0,document.querySelector('.sp[data-k="u0"]'),SAYL.u0)}
$("#cSn").onclick=()=>{const v=$("#vid");if(!v.videoWidth)return toast(t("err"));const c=document.createElement("canvas"),k=Math.min(1,1024/v.videoWidth);c.width=Math.round(v.videoWidth*k);c.height=Math.round(v.videoHeight*k);c.getContext("2d").drawImage(v,0,0,c.width,c.height);const u=c.toDataURL("image/jpeg",.8);closeCam();analyze(u)};
$("#file").onchange=e=>{const fl=e.target.files[0];e.target.value="";if(!fl)return;closeCam();const u=URL.createObjectURL(fl);busy=u;render();window.scrollTo({top:0,behavior:"smooth"});shrink(u,1024,.8).then(analyze).catch(()=>{busy=null;render();toast(t("err"))})};
document.addEventListener("click",e=>{const b=e.target.closest(".sp[data-k]");if(b){e.stopPropagation();speak(SAY[b.dataset.k],b,SAYL[b.dataset.k])}else if(e.target.closest("#gbtn"))openGal()},true);

/* ---- in-app gallery ---- */
const gal=$("#gal");
function galRender(){const b=$("#gb"),x=$("#gx");$("#gt").textContent=t("gal");
 if(gv!=null){const r=scans.find(s=>s.id==gv);if(!r){gv=null;return galRender()}x.textContent="‹";b.innerHTML=scanView(r,"u2")+`<button class="btn g" id="gd" style="color:#ffb4a8">${t("del")}</button>`;b.scrollTop=0;return}
 x.textContent="✕";
 b.innerHTML=scans.length?`<div class="gg">${scans.map(r=>{const d=r.demo?{healthy:false,severity:"Medium"}:r.d,c=d.healthy?"#1b7a4b":d.severity=="High"?"#d32f2f":"#f29900";return`<button data-id="${r.id}"><img src="${r.img}" alt=""><i style="background:${c}"></i><small>${new Date(r.ts).toLocaleDateString(VL[S.lang],{day:"numeric",month:"short"})}</small></button>`}).join("")}</div>`:`<p class="up" style="margin-top:40px">${t("noscans")}</p>`}
function openGal(i){gv=i==null?null:i;galRender();gal.classList.add("o")}
$("#gx").onclick=()=>{if(gv!=null){gv=null;stopSp();galRender()}else{stopSp();gal.classList.remove("o")}};
$("#gb").addEventListener("click",e=>{const t1=e.target.closest(".gg button");if(t1){gv=+t1.dataset.id;galRender();return}
 if(e.target.closest("#gd")){const id=gv;ask(t("delT"),t("delB"),t("del"),t("cwN"),()=>{scans=scans.filter(s=>s.id!=id);saveScans();gv=null;stopSp();galRender();render()})}});
$("#bG").innerHTML=I("img");$("#bG").onclick=()=>openGal();

/* ---- warning dialog ---- */
function ask(title,body,yes,no,fn){const m=$("#md"),h=()=>{m.style.display="none"};
 m.innerHTML=`<div class="mb" role="alertdialog" aria-modal="true"><div class="mi">⚠️</div><h3>${title}</h3><p>${body}</p><button class="btn" id="mn">${no}</button><button class="btn a dng" id="my">${yes}</button></div>`;
 m.style.display="flex";$("#mn").focus();$("#mn").onclick=h;$("#my").onclick=()=>{h();fn()};m.onclick=e=>{if(e.target==m)h()}}
apply();chk();live();setInterval(live,600000);setInterval(tick,30000);
</script></body></html>
